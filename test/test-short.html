<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short page test</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    font: 17px/1.55 Georgia, serif;
    color: #111;
    background: linear-gradient(160deg, #eef3f8, #f8f4ec 55%, #e6efe8);
  }
  h1 { margin: 0 0 10px; font: 600 18px system-ui, sans-serif; }
  p { margin: 0 0 12px; }
  .card {
    padding: 12px 14px;
    background: #fff;
    border: 2px solid #111;
    border-radius: 6px;
  }
  button {
    padding: 8px 14px;
    font: 15px system-ui, sans-serif;
    border: 1px solid #111;
    border-radius: 4px;
    background: #fff;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Short page test</h1>
  <p>This page is shorter than one screen. There is nothing to page through and
  nothing to scroll, so the extension should have no effect here.</p>
  <p>Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor
  incididunt ut labore et dolore magna aliqua.</p>
  <p><a href="#">A link</a> &middot; <button type="button">A button</button></p>
</div>
</body>
</html>
